# 暫時用：在 GitHub 的機器上跑登入後 E2E（PR #89 的收藏與我的路線測試），跑完就刪掉這個檔案。
# 直接測正式站（E2E_BASE_URL），所以只需要測試帳號兩個 Secrets（Settings → Secrets and variables → Actions）：
#   E2E_USER_EMAIL, E2E_USER_PASSWORD
# PR #89 沒有改網站程式，只加測試，所以測正式站等於測這個 PR 的測試。
name: 登入後 E2E（暫時）

on:
  # workflow_dispatch 要檔案在 main 才按得到，所以改成推到這個 branch 就跑
  push:
    branches: [claude/project-thread-phhc8e]
  workflow_dispatch:

concurrency:
  group: e2e-logged-in-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-logged-in:
    name: 登入後 E2E（收藏、我的路線、Dashboard）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: strava-route-system
    env:
      E2E_BASE_URL: https://dawnline-tw.vercel.app
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      # 沒設帳號時測試會整組「跳過」而顯示綠燈，這裡先擋下來，避免誤以為通過
      - name: 檢查必要的 Secrets
        working-directory: .
        run: |
          missing=""
          for v in E2E_USER_EMAIL E2E_USER_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::缺少 Secrets:$missing"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: strava-route-system/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: strava-route-system/.nvmrc
          cache: pnpm
          cache-dependency-path: strava-route-system/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter web...

      - name: 安裝 Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # 先登入、存好 playwright/.auth/user.json，再跑需要登入狀態的測試。
      # 兩組放在同一個指令加 --no-deps 會同時開跑，dashboard 在狀態檔寫好前就去讀而失敗
      - name: 登入測試帳號
        run: pnpm --filter web exec playwright test --project=auth-setup

      - name: 登入後 E2E
        run: pnpm --filter web exec playwright test --project=e2e-dashboard --no-deps

      - name: 上傳報告與 trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            strava-route-system/apps/web/playwright-report
            strava-route-system/apps/web/test-results
          if-no-files-found: ignore
