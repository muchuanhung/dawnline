name: Backend CI

# 只在後端相關檔案變動時跑；前端 CI 見 ci.yml
on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend pytest 與 ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .

  backend-mysql:
    name: Backend Docker 與 MySQL 8.4 驗證
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 啟動 api 與 MySQL（migration 在 api 啟動時跑）
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: /health 要通過 SELECT 1
        run: |
          out=$(curl -fsS http://localhost:8000/health)
          echo "$out"
          echo "$out" | grep -q '"database":"ok"'

      - name: Alembic 版本與 migration 往返
        run: |
          docker compose exec -T api alembic current | grep -q '0005 (head)'
          docker compose exec -T api alembic downgrade base
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic current | grep -q '0005 (head)'

      - name: MySQL 設定與 schema（時區、utf8mb4、空間索引、FK）
        run: |
          q() { docker compose exec -T mysql mysql -uroot -prootpass velorder -N -e "$1" 2>/dev/null; }
          [ "$(q 'SELECT @@global.time_zone')" = "+00:00" ]
          [ "$(q 'SELECT @@character_set_server')" = "utf8mb4" ]
          q 'SHOW CREATE TABLE routes' | tee /dev/stderr | grep -q 'SPATIAL KEY `sp_routes_bbox`'
          q 'SHOW CREATE TABLE routes' | grep -q 'fk_routes_user'
          q 'SHOW CREATE TABLE routes' | grep -q '`route_type` varchar(20) NOT NULL DEFAULT'
          q 'SHOW CREATE TABLE segments' | grep -q 'SPATIAL KEY `sp_segments_geom`'
          q 'SHOW CREATE TABLE segments' | grep -q 'fk_segments_route.*ON DELETE CASCADE'
          q 'SHOW CREATE TABLE cctv' | tee /dev/stderr | grep -q 'SPATIAL KEY `sp_cctv_location`'
          q 'SHOW CREATE TABLE cctv' | grep -qi 'point NOT NULL /\*!80003 SRID 4326 \*/'
          q 'SHOW CREATE TABLE sessions' | grep -q 'fk_sessions_user.*ON DELETE CASCADE'
          [ "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='velorder' AND table_name='members'")" = "0" ]
          q 'SHOW CREATE TABLE users' | grep -q 'uq_users_firebase_uid'

      - name: routes 寫入空間欄位（bbox 用 lon lat WKT、SRID 4326）
        run: |
          docker compose exec -T api python - <<'PY'
          from sqlalchemy import text
          from sqlalchemy.orm import Session
          from app.core.db import get_engine, utcnow
          from app.core.types import geometry_from_wkt
          from app.models import Route, User
          wkt = "POLYGON((121.5 25.1,121.6 25.1,121.6 25.2,121.5 25.2,121.5 25.1))"
          with Session(get_engine()) as db:
              user = User(firebase_uid="ci", created_at=utcnow(), last_login_at=utcnow())
              db.add(user)
              db.flush()
              db.add(Route(public_id="0" * 26, user_id=user.id, name="ci", s3_key="k", file_size=1,
                           file_sha256="0" * 64, status="ready", bbox=geometry_from_wkt(db, wkt)))
              db.flush()
              row = db.execute(text(
                  "SELECT ST_AsText(bbox, 'axis-order=long-lat'), ST_SRID(bbox), ST_Latitude(ST_StartPoint(ST_ExteriorRing(bbox))) FROM routes"
              )).one()
              print(row)
              assert row[1] == 4326 and abs(row[2] - 25.1) < 1e-9, row
              db.rollback()
          PY

      - name: 容器以非 root 執行
        run: '[ "$(docker compose exec -T api id -u)" = "10001" ]'

      - name: 失敗時印 log
        if: failure()
        run: docker compose logs --no-color

      - name: 清除
        if: always()
        run: docker compose down -v
