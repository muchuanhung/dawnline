[project]
name = "velorder-backend"
version = "0.1.0"
description = "曉行 Routecast 後端 API（FastAPI + MySQL）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "google-auth[requests]>=2.29",
  "boto3>=1.34",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "moto[s3]>=5.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# 專案內的 alembic/ 目錄不是套件，避免被當成 first-party
known-third-party = ["alembic"]
