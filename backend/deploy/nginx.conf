# Dawnline API reverse proxy on EC2 (Tokyo, ap-northeast-1).
# Installed at /etc/nginx/conf.d/dawnline-api.conf on the same host as the
# message board (message-board.bid -> 127.0.0.1:8000, untouched).
#
#   Vercel /api/v1/* --HTTPS--> Nginx :443 --> 127.0.0.1:8001 (velorder-api container)
#
# TLS: Let's Encrypt via certbot (webroot). Renewal: /etc/cron.weekly/dawnline-certbot,
# see backend/docs/deploy-aws.md section 4. No ALB (cost).
#
# Apply after editing:
#   sudo cp backend/deploy/nginx.conf /etc/nginx/conf.d/dawnline-api.conf
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# Rate limiting (http context: files in conf.d/ are included inside http {}).
#
# Browsers reach this API through Vercel's /api/v1/* rewrite, so $remote_addr is
# a Vercel egress IP shared by many users. Key on the first X-Forwarded-For hop
# (the real client as Vercel reports it) and fall back to $remote_addr for
# requests that come here directly. A direct caller can forge X-Forwarded-For to
# dodge the per-client limits, so dawnline_peer still caps each connecting IP.
#
# DAWNLINE_RATE_LIMIT_DRY_RUN: starts "on" = only log what would be rejected
# (error.log: "limiting requests, dry run"). Switch to "off" after checking the
# log that keys are real client IPs and nobody normal hits the limits.
# See backend/docs/deploy-aws.md section 12.
# ---------------------------------------------------------------------------
map $http_x_forwarded_for $dawnline_client {
    "~^(?<dawnline_first_hop>[^,\s]+)" $dawnline_first_hop;
    default                           $remote_addr;
}

# Login / logout: Firebase ID token exchange. 10 per minute, burst 10.
limit_req_zone $dawnline_client zone=dawnline_auth:10m rate=10r/m;
# Presigned upload issuance and upload completion. 30 per minute, burst 20.
limit_req_zone $dawnline_client zone=dawnline_upload:10m rate=30r/m;
# Everything else, per client. 10 per second, burst 50.
limit_req_zone $dawnline_client zone=dawnline_api:10m rate=10r/s;
# Per connecting IP (Vercel egress or a direct caller). Generous: Vercel pools
# many users behind few IPs.
limit_req_zone $binary_remote_addr zone=dawnline_peer:10m rate=50r/s;

log_format dawnline_api '$remote_addr client=$dawnline_client [$time_local] '
                        '"$request" $status $body_bytes_sent $request_time '
                        'xff="$http_x_forwarded_for"';

# Port 80: only ACME HTTP-01 challenges; everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name dawnline-api.message-board.bid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dawnline-api.message-board.bid;

    ssl_certificate     /etc/letsencrypt/live/dawnline-api.message-board.bid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dawnline-api.message-board.bid/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dawnline_ssl:10m;
    ssl_session_timeout 1d;

    # GPX goes browser -> S3 via presigned POST; the API only receives JSON.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # uvicorn runs with --proxy-headers, so request.url.scheme becomes https.
    proxy_set_header X-Forwarded-Proto https;

    access_log /var/log/nginx/dawnline-api.access.log dawnline_api;

    limit_req_status    429;
    limit_req_log_level warn;
    limit_req_dry_run   on;   # DAWNLINE_RATE_LIMIT_DRY_RUN


    location = /api/v1/auth/session {
        limit_req zone=dawnline_peer burst=100 nodelay;
        limit_req zone=dawnline_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # POST /api/v1/routes (finish upload) shares the path with GET (list), so it is
    # covered by dawnline_api; the presigned issuance below is what costs S3 calls.
    location ~ ^/api/v1/(routes|me/avatar|admin/public-routes)/uploads$ {
        limit_req zone=dawnline_peer burst=100 nodelay;
        limit_req zone=dawnline_upload burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        limit_req zone=dawnline_peer burst=100 nodelay;
        limit_req zone=dawnline_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
}
