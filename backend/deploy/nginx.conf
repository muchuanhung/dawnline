# Dawnline API reverse proxy on EC2 (Tokyo, ap-northeast-1).
# Installed at /etc/nginx/conf.d/dawnline-api.conf on the same host as the
# message board (message-board.bid -> 127.0.0.1:8000, untouched).
#
#   Vercel /api/v1/* --HTTPS--> Nginx :443 --> 127.0.0.1:8001 (velorder-api container)
#
# TLS: Let's Encrypt via certbot (webroot). Renewal: /etc/cron.weekly/dawnline-certbot,
# see backend/docs/deploy-aws.md section 4. No ALB (cost).
#
# Apply after editing:
#   sudo cp backend/deploy/nginx.conf /etc/nginx/conf.d/dawnline-api.conf
#   sudo nginx -t && sudo systemctl reload nginx

# Port 80: only ACME HTTP-01 challenges; everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name dawnline-api.message-board.bid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dawnline-api.message-board.bid;

    ssl_certificate     /etc/letsencrypt/live/dawnline-api.message-board.bid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dawnline-api.message-board.bid/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dawnline_ssl:10m;
    ssl_session_timeout 1d;

    # GPX goes browser -> S3 via presigned POST; the API only receives JSON.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # uvicorn runs with --proxy-headers, so request.url.scheme becomes https.
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://127.0.0.1:8001;
    }
}
